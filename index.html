<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人简历作品集</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="fixed top-0 left-0 right-0 bg-white/80 backdrop-blur-lg border-b border-blue-100 z-50 h-14">
      <div class="flex items-center justify-between h-full px-6 max-w-6xl mx-auto">
        <div class="flex items-center gap-3">
          <button id="menuToggle" class="lg:hidden p-2 rounded-lg hover:bg-blue-50">
            <i class="fas fa-bars text-blue-600"></i>
          </button>
          <h1 class="text-lg font-bold text-blue-900">
            <i class="fas fa-id-card text-blue-500 mr-2"></i>个人简历作品集
          </h1>
        </div>
        <div class="flex items-center gap-3">
          <button id="exportPdfBtn" class="btn-primary">
            <i class="fas fa-file-pdf"></i> 保存为PDF
          </button>
        </div>
      </div>
    </header>

    <aside id="sidebar" class="sidebar">
      <div class="p-4">
        <div class="user-info-card mb-6 p-4 rounded-xl bg-gradient-to-br from-blue-50 to-indigo-50">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-blue-200 flex items-center justify-center overflow-hidden" id="navAvatar">
              <i class="fas fa-user text-blue-600"></i>
            </div>
            <div>
              <div class="font-semibold text-blue-900" id="navUserName">未填写姓名</div>
              <div class="text-sm text-blue-500" id="navUserTitle">未填写求职意向</div>
            </div>
          </div>
        </div>
        <nav class="space-y-1">
          <a href="#basic" class="nav-item active" data-section="basic">
            <i class="fas fa-user-circle"></i>
            <span>基本信息</span>
          </a>
          <a href="#education" class="nav-item" data-section="education">
            <i class="fas fa-graduation-cap"></i>
            <span>教育经历</span>
          </a>
          <a href="#projects" class="nav-item" data-section="projects">
            <i class="fas fa-folder-open"></i>
            <span>项目经历</span>
            <span class="nav-badge" id="projectCount">0</span>
          </a>
          <a href="#campus" class="nav-item" data-section="campus">
            <i class="fas fa-school"></i>
            <span>校园经历</span>
          </a>
          <a href="#skills" class="nav-item" data-section="skills">
            <i class="fas fa-tools"></i>
            <span>个人技能</span>
          </a>
        </nav>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div class="p-6 max-w-4xl mx-auto">
        
        <section id="basic" class="section active">
          <h2 class="section-title">基本信息</h2>
          <div class="card p-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div class="md:col-span-2 grid grid-cols-2 gap-4">
                <div class="col-span-2 sm:col-span-1">
                  <label class="label">姓名</label>
                  <input type="text" class="input-field" data-field="name" placeholder="请输入姓名">
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="label">性别</label>
                  <select class="input-field" data-field="gender">
                    <option value="">请选择</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                  </select>
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="label">政治面貌</label>
                  <input type="text" class="input-field" data-field="political" placeholder="如：中共党员">
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="label">籍贯</label>
                  <input type="text" class="input-field" data-field="hometown" placeholder="如：北京市">
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="label">求职意向</label>
                  <input type="text" class="input-field" data-field="jobTarget" placeholder="如：前端工程师">
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="label">出生年月</label>
                  <input type="month" class="input-field" data-field="birthDate">
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="label">电子邮箱</label>
                  <input type="email" class="input-field" data-field="email" placeholder="example@email.com">
                </div>
                <div class="col-span-2 sm:col-span-1">
                  <label class="label">联系方式</label>
                  <input type="tel" class="input-field" data-field="phone" placeholder="138xxxxxxxx">
                </div>
              </div>
              <div class="flex flex-col items-center">
                <label class="label">个人头像</label>
                <div class="avatar-upload" id="avatarUpload">
                  <div id="avatarPreview" class="avatar-preview">
                    <i class="fas fa-camera"></i>
                  </div>
                  <div class="avatar-overlay">
                    <span>更换头像</span>
                  </div>
                </div>
                <input type="file" id="avatarInput" class="hidden" accept="image/*">
                <p class="text-xs text-blue-400 mt-2">点击上传 (3:4比例)</p>
              </div>
            </div>
          </div>
        </section>

        <section id="education" class="section">
          <div class="flex items-center justify-between mb-5">
            <h2 class="section-title mb-0">教育经历</h2>
            <button class="btn-primary" id="addEducationBtn">
              <i class="fas fa-plus"></i> 添加经历
            </button>
          </div>
          <div id="educationList" class="space-y-4"></div>
        </section>

        <section id="projects" class="section">
          <div class="flex items-center justify-between mb-5">
            <h2 class="section-title mb-0">项目经历</h2>
            <button class="btn-primary" id="addProjectBtn">
              <i class="fas fa-plus"></i> 添加项目
            </button>
          </div>
          <div id="projectsList" class="space-y-4"></div>
        </section>

        <section id="campus" class="section">
          <div class="flex items-center justify-between mb-5">
            <h2 class="section-title mb-0">校园经历</h2>
            <button class="btn-primary" id="addCampusBtn">
              <i class="fas fa-plus"></i> 添加经历
            </button>
          </div>
          <div id="campusList" class="space-y-4"></div>
        </section>

        <section id="skills" class="section">
          <div class="flex items-center justify-between mb-5">
            <h2 class="section-title mb-0">个人技能</h2>
            <button class="btn-primary" id="addSkillCategoryBtn">
              <i class="fas fa-plus"></i> 添加分类
            </button>
          </div>
          <div id="skillsList" class="space-y-4"></div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
